<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>配送マップ 試作1号機</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root{
    --blue:#4FA0D6;
    --green:#6B9080;
    --red:#D6453F;
    --orange:#E8862E;
    --ink:#1f2937;
    --paper:#ffffff;
    --sub:#6b7280;
    --line:#e5e7eb;
    --bg:#f3f4f6;
    --header-h:56px; /* 実際の高さはJSでheader要素から測って上書きする（機種による差を自動で吸収） */
  }

  /* ---------- ダークモード ---------- */
  html[data-theme="dark"]{
    --ink:#e5e7eb;
    --paper:#1f2937;
    --bg:#0f172a;
    --sub:#9ca3af;
    --line:#374151;
  }
  /* CSS変数化されていない、個別にハードコードされた白背景の要素はここで上書きする */
